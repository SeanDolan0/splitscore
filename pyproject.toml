[project]
name = "splitscore"
version = "0.1.0"
description = "Separate audio into stems with BS-RoFormer-SW, then transcribe to MIDI with MuScriptor"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]

dependencies = [
    "torch>=2.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "onnxruntime-gpu>=1.21,<1.27",  # 1.27+ is built against CUDA 13
    "soundfile>=0.12",
    "huggingface-hub>=0.24",
    "muscriptor==0.3.0",
]

[project.urls]
Homepage = "https://github.com/SeanDolan0/splitscore"
Repository = "https://github.com/SeanDolan0/splitscore"

[project.scripts]
splitscore = "app.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

# torch is optional: `uvx splitscore` auto-detects GPU and installs it at startup.
# For dev, run `uv run python sync.py` which detects GPU and installs torch into the venv.
# Environments restriction prevents muscriptor's macOS torch conflict from breaking resolution.
[tool.uv]
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'linux'",
]

# Wheel build: setuptools must include app/static/ (the frontend) or uvx / pip
# installs start with a 404'd page — static is mounted from the package at runtime.
[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["static/*"]
